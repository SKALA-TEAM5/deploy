apiVersion: apps/v1
kind: Deployment
metadata:
  name: team5-fastapi
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-fastapi
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: team5-fastapi
  template:
    metadata:
      labels:
        app: team5-fastapi
    spec:
      imagePullSecrets:
        - name: team5-harbor-secret
      containers:
        - name: fastapi
          image: amdp-registry.skala-ai.com/skala26a-ai2/team5-fastapi:e389f8d
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: team5-fastapi-config
            - secretRef:
                name: team5-fastapi-secret
          env:
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "20m"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
