apiVersion: v1
kind: ConfigMap
metadata:
  name: team5-grafana-datasources
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-grafana
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Team5 Prometheus
        uid: team5-prometheus
        type: prometheus
        access: proxy
        url: http://team5-prometheus:9090
        isDefault: true
        editable: false
