apiVersion: v1
kind: ConfigMap
metadata:
  name: team5-grafana-dashboard-providers
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Team5
        orgId: 1
        folder: Team5
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
