apiVersion: apps/v1
kind: Deployment
metadata:
  name: team5-grafana
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-grafana
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: team5-grafana
  template:
    metadata:
      labels:
        app: team5-grafana
      annotations:
        team5.skala-ai.com/config-revision: "3"
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.5.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: team5-grafana-datasources
        - name: dashboard-providers
          configMap:
            name: team5-grafana-dashboard-providers
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: team5-grafana-dashboards
              - configMap:
                  name: team5-grafana-ai-agent-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: team5-grafana-data
