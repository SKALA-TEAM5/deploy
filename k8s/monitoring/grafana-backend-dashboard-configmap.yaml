apiVersion: v1
kind: ConfigMap
metadata:
  name: team5-grafana-dashboards
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-grafana
data:
  backend-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "team5-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "text": "DOWN"
                    },
                    "1": {
                      "color": "green",
                      "text": "UP"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "expr": "up{job=\"team5-backend\"}",
              "legendFormat": "Backend",
              "refId": "A"
            }
          ],
          "title": "Backend 상태",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "team5-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"team5-backend\"}[5m]))",
              "refId": "A"
            }
          ],
          "title": "초당 요청 수",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "team5-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_sum{job=\"team5-backend\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=\"team5-backend\"}[5m])), 0.000001)",
              "refId": "A"
            }
          ],
          "title": "평균 응답시간",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "team5-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "max": 100,
              "min": 0,
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "100 * sum(rate(http_server_requests_seconds_count{job=\"team5-backend\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{job=\"team5-backend\"}[5m])), 0.000001)",
              "refId": "A"
            }
          ],
          "title": "5xx 오류율",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "team5-prometheus"
          },
          "fieldConfig": {
