            "y": 5
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (method, uri) (rate(http_server_requests_seconds_count{job=\"team5-backend\"}[5m]))",
              "legendFormat": "{{method}} {{uri}}",
              "refId": "A"
            }
          ],
          "title": "API별 요청량",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "team5-prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
