            "y": 5
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum by (method, uri) (rate(http_server_requests_seconds_sum{job=\"team5-backend\"}[5m])) / clamp_min(sum by (method, uri) (rate(http_server_requests_seconds_count{job=\"team5-backend\"}[5m])), 0.000001)",
