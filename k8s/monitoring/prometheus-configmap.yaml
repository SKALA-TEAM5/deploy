apiVersion: v1
kind: ConfigMap
metadata:
  name: team5-prometheus-config
  namespace: skala3-finalproj-class2-team5
  labels:
    app: team5-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - /etc/prometheus/ai-agent-alerts.yml

    scrape_configs:
      - job_name: team5-prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: team5-backend
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - team5-backend:8000

      - job_name: team5-fastapi
        metrics_path: /metrics
        static_configs:
          - targets:
              - team5-fastapi:8001
  ai-agent-alerts.yml: |
    groups:
      - name: ai-agent-observability
        rules:
          - alert: AIAgentHighFailureRate
            expr: |
              (
                sum by (agent) (rate(ai_agent_runs_total{result="fail"}[10m]))
                /
                clamp_min(sum by (agent) (rate(ai_agent_runs_total[10m])), 0.001)
              ) > 0.2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "AI Agent failure rate is high"
              description: "{{ $labels.agent }} Agent failure rate exceeded 20% for 10 minutes."

          - alert: AIAgentSlowP95
            expr: |
              histogram_quantile(
                0.95,
                sum by (le, agent) (
                  rate(ai_agent_run_duration_seconds_bucket[10m])
                )
              ) > 120
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "AI Agent P95 latency is high"
              description: "{{ $labels.agent }} Agent P95 latency exceeded 120 seconds for 10 minutes."

          - alert: AIAgentRunStuck
            expr: ai_agent_runs_in_progress > 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "AI Agent run may be stuck"
              description: "{{ $labels.agent }} Agent has remained in progress for more than 15 minutes."

          - alert: BackendAgentDispatchFailures
            expr: |
              sum by (operation) (
                increase(backend_agent_dispatch_total{result="fail"}[10m])
              ) >= 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Backend to FastAPI dispatch is failing"
              description: "{{ $labels.operation }} dispatch failed at least three times in ten minutes."
